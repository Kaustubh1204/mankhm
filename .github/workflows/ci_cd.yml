name: Cyclone AI System CI/CD Pipeline

on:
  push:
    branches: [ main, feature/cyclone-pipeline-dev, integrated-system ]
  pull_request:
    branches: [ main, integrated-system ]

jobs:
  # Job 1: ML Pipeline Unit Tests & Model Verification
  test-ml-pipeline:
    name: Run ML Tests & INT8 Quantization Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install uvicorn fastapi onnxruntime numpy pytest python-dotenv boto3

      - name: Run Model Export & INT8 Quantization Verification
        run: |
          python src/ml/export_onnx.py
          python src/ml/quantize_onnx.py

      - name: Run System Performance Benchmark & Evaluation Matrix
        run: |
          python src/ml/evaluate.py

      - name: Run Real Satellite Dataset Partition Loader Test
        run: |
          python src/ml/real_dataset_loader.py

  # Job 2: Automated Cloudflare Workers Edge Deployment
  deploy-cloudflare-edge:
    name: Deploy to Cloudflare Workers Edge
    needs: test-ml-pipeline
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/cyclone-pipeline-dev' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy Cloudflare Worker Edge API
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 9b71ceec4d29765773ad3dcc4b1d57da

  # Job 3: Build Docker Containers
  build-docker-containers:
    name: Verify Docker Container Build
    needs: test-ml-pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Python AI Inference Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false

      - name: Build Node.js MOSDAC Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.node
          push: false
