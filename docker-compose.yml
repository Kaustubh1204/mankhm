version: '3.8'

services:
  # 1. Python AI Prediction Inference Server (ONNX Runtime + PyTorch)
  cyclone-ai-inference:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cyclone-ai-inference
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DETECTION_MODEL_TYPE=RT-DETRv2-OBB
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. Node.js MOSDAC Ingestion & WebSocket Engine
  mosdac-ingester-server:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: mosdac-ingester-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AI_INFERENCE_URL=http://cyclone-ai-inference:8000
    depends_on:
      - cyclone-ai-inference
    restart: unless-stopped
